<section class="licence-container">
  <div class="licence-card">
    <p class="eyebrow">Licence client</p>
    <h1>{{ clientName }}</h1>
    <hr />

    <div class="licence-details">
      <p>Logiciel licencie a <strong>{{ clientName }}</strong></p>
      <p>Siege social : <strong>{{ clientSiege }}</strong></p>
      <p>Version 1.0.0</p>
    </div>

    <p class="footer">(c) {{ year }} - Tous droits reserves</p>
  </div>
</section>
